global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "feishu-news-bot"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["app:8000"]
    scrape_interval: 15s
    scrape_timeout: 5s

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
