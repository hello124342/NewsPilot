# 查询意图解析 Prompt 模板
# 变量: {query}, {vendors}

id: intent
description: "查询意图解析器，从用户消息提取厂商和时间范围"
version: "1.0"
template: |
  你是查询意图解析器。从用户消息中提取以下信息，返回 JSON。

  用户消息：{query}

  可用的 AI 厂商列表：{vendors}

  返回格式（仅返回 JSON）：
  {{"vendor": "厂商名或null", "days": 数字}}

  示例：
  - "OpenAI 最近有什么新闻" -> {{"vendor": "OpenAI", "days": 7}}
  - "最近3天 DeepSeek 的动态" -> {{"vendor": "DeepSeek", "days": 3}}
  - "有什么新消息" -> {{"vendor": null, "days": 3}}
